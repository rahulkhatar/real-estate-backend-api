# Container-based deploy path: builds the API into a Docker image, pushes it to Docker Hub
# (rahulk86/real-estate:api), and deploys that exact image to an Azure Web App for Containers.
#
# This supersedes dev_real-estate-api.yml's binary-publish deploy (dotnet publish -> upload
# artifact -> azure/webapps-deploy with `package:`). That workflow's push-to-main trigger has
# been disabled so only this one fires automatically -- it's kept around as a manual
# (workflow_dispatch) fallback to the old binary-deploy path if we ever need it.
#
# TODO before this can deploy successfully:
#   1. The azure/login step below reuses the same federated-identity secrets as
#      dev_real-estate-api.yml, which belong to a Managed Identity scoped to the OLD web app.
#      That identity needs Contributor (or Website Contributor) access on the NEW web app's
#      resource group too, or you'll get an authorization error on the deploy step -- if Azure's
#      own Deployment Center wizard generates a fresh identity for the new app instead, update
#      the three AZUREAPPSERVICE_*_ secret names referenced below to match.

name: Build, push to Docker Hub, and deploy container

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: rahulk86/real-estate

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - run: dotnet restore RealEstate.Api/RealEstate.Api.csproj
      - run: dotnet build RealEstate.Api/RealEstate.Api.csproj --configuration Release --no-restore
      - run: dotnet test RealEstate.Tests/RealEstate.Tests.csproj --configuration Release

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:api
            ${{ env.IMAGE_NAME }}:api-${{ steps.meta.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D58926F8AED6469391F9E1E7005C7A25 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AD97236815ED401CBE4F52084F3D750D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6976691A9DA948088CC057689596C4B8 }}

      - name: Deploy container image to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'real-estate-docker-api'
          slot-name: 'Production'
          images: '${{ env.IMAGE_NAME }}:api-${{ needs.build-and-push.outputs.image-tag }}'
