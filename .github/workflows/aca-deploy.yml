# Container-based deploy path: builds the API into a Docker image, pushes it to Docker Hub
# (rahulk86/real-estate:latest), and deploys that exact image to Azure Container Apps.
#
# Supersedes the earlier Web-App-for-Containers attempt (previously docker-deploy.yml). That
# path failed because it reused a Managed Identity scoped to a different, unrelated Web App --
# this workflow uses a fresh identity (real-estate-aca-deployer) created and scoped correctly
# (Container Apps Contributor on the ai-azure-ls resource group) from the start.
#
# dev_real-estate-api.yml's push-to-main trigger stays disabled -- only this workflow
# auto-deploys.
#
# Verified end-to-end via a manual workflow_dispatch run on dev (test -> build-and-push ->
# deploy all succeeded, prod approval gate exercised, live app confirmed serving the deployed
# image) before enabling the push:[main] trigger below.

name: Build, push, and deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: rahulk86/real-estate

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - run: dotnet restore RealEstate.Api/RealEstate.Api.csproj
      - run: dotnet build RealEstate.Api/RealEstate.Api.csproj --configuration Release --no-restore
      - run: dotnet test RealEstate.Tests/RealEstate.Tests.csproj --configuration Release

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_ACA_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            # --revision-suffix forces a new revision (and a real image re-pull) on every run.
            # Without it, Azure Container Apps diffs the update request against the currently
            # configured revision and treats an unchanged ":latest" tag string as a no-op --
            # it reports success but never actually deploys the new image bits. Suffixing with
            # the commit SHA + run number guarantees a unique, unused revision name every time,
            # even for a workflow_dispatch re-run of the same commit.
            az containerapp update -n real-estate-backend -g ai-azure-ls \
              --image ${{ env.IMAGE_NAME }}:latest \
              --revision-suffix sha-${GITHUB_SHA:0:7}-${{ github.run_number }}

  # Parallel deploy target: the AKS cluster running the same image, set up alongside (not
  # replacing) Container Apps while that migration is being verified. Requires the
  # real-estate-aca-deployer identity to be granted "Azure Kubernetes Service RBAC Writer" on
  # the real-estate-aks cluster -- until that's done, this job fails harmlessly on its own,
  # the Container Apps deploy above is unaffected.
  deploy-aks:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_ACA_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ai-azure-ls
          cluster-name: real-estate-aks

      - name: Roll out new image
        run: |
          # kubectl apply alone wouldn't trigger a new pull here -- the pod template's image
          # string (":latest") is unchanged even though the tag's actual content is new.
          # rollout restart forces a new pod generation regardless, and imagePullPolicy: Always
          # (set in k8s/overlays/azure) makes that generation fetch the fresh image bits.
          kubectl rollout restart deployment/backend-deployment -n real-estate
          kubectl rollout status deployment/backend-deployment -n real-estate --timeout=120s
