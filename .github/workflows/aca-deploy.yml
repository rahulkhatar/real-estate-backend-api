# Container-based deploy path: builds the API into a Docker image, pushes it to Docker Hub
# (rahulk86/real-estate:latest), and deploys that exact image to Azure Container Apps.
#
# Supersedes the earlier Web-App-for-Containers attempt (previously docker-deploy.yml). That
# path failed because it reused a Managed Identity scoped to a different, unrelated Web App --
# this workflow uses a fresh identity (real-estate-aca-deployer) created and scoped correctly
# (Container Apps Contributor on the ai-azure-ls resource group) from the start.
#
# dev_real-estate-api.yml's push-to-main trigger stays disabled -- only this workflow
# auto-deploys.
#
# Verified end-to-end via a manual workflow_dispatch run on dev (test -> build-and-push ->
# deploy all succeeded, prod approval gate exercised, live app confirmed serving the deployed
# image) before enabling the push:[main] trigger below.

name: Build, push, and deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: rahulk86/real-estate

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - run: dotnet restore RealEstate.Api/RealEstate.Api.csproj
      - run: dotnet build RealEstate.Api/RealEstate.Api.csproj --configuration Release --no-restore
      - run: dotnet test RealEstate.Tests/RealEstate.Tests.csproj --configuration Release

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # DevSecOps rollout: security-events write needed for the Trivy SARIF upload step below.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      # DevSecOps rollout: Trivy container image CVE scan, report-only for now (exit-code: 0).
      # ignore-unfixed skips CVEs with no available patch yet -- nothing actionable there today.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      # DevSecOps rollout: publish Trivy findings to the repo's Security tab, alongside CodeQL.
      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_ACA_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            # --revision-suffix forces a new revision (and a real image re-pull) on every run.
            # Without it, Azure Container Apps diffs the update request against the currently
            # configured revision and treats an unchanged ":latest" tag string as a no-op --
            # it reports success but never actually deploys the new image bits. Suffixing with
            # the commit SHA + run number guarantees a unique, unused revision name every time,
            # even for a workflow_dispatch re-run of the same commit.
            az containerapp update -n real-estate-backend -g ai-azure-ls \
              --image ${{ env.IMAGE_NAME }}:latest \
              --revision-suffix sha-${GITHUB_SHA:0:7}-${{ github.run_number }}

  # ============================================================================================
  # KUBERNETES (AKS) -- PAUSED. Everything below is commented out on purpose: pushes to main
  # now behave exactly as they did before any Kubernetes work (test -> build-and-push -> deploy
  # to Container Apps only). The AKS cluster, k8s/ manifests, and IAM grants are all still
  # intact and untouched -- to resume auto-deploying to AKS on every push, just uncomment the
  # deploy-aks job below, no other changes needed.
  # ============================================================================================
  # # Parallel deploy target: the AKS cluster running the same image, set up alongside (not
  # # replacing) Container Apps while that migration is being verified. Requires the
  # # real-estate-aca-deployer identity to be granted BOTH "Azure Kubernetes Service Cluster
  # # User Role" (lets it call get-credentials at all) AND "Azure Kubernetes Service RBAC
  # # Writer" (lets it actually read/write objects once connected) on the real-estate-aks
  # # cluster -- two separate Azure RBAC layers, easy to grant only one by mistake. Until both
  # # are done, this job fails harmlessly on its own, the Container Apps deploy above is
  # # unaffected.
  # deploy-aks:
  #   needs: build-and-push
  #   runs-on: ubuntu-latest
  #   environment: prod
  #   permissions:
  #     id-token: write
  #     contents: read
  #   steps:
  #     - name: Login to Azure
  #       uses: azure/login@v2
  #       with:
  #         client-id: ${{ secrets.AZURE_ACA_DEPLOYER_CLIENT_ID }}
  #         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
  #         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  #
  #     # The cluster uses Azure AD + Azure RBAC for Kubernetes auth, so kubectl needs the
  #     # kubelogin exec-plugin binary to convert an AAD token into cluster credentials --
  #     # ubuntu-latest runners don't have it preinstalled.
  #     - name: Set up kubelogin
  #       uses: azure/use-kubelogin@v1
  #       with:
  #         kubelogin-version: v0.2.9
  #
  #     - name: Set AKS context
  #       uses: azure/aks-set-context@v4
  #       with:
  #         resource-group: ai-azure-ls
  #         cluster-name: real-estate-aks
  #         admin: false
  #         use-kubelogin: true
  #
  #     - name: Roll out new image
  #       run: |
  #         # kubectl apply alone wouldn't trigger a new pull here -- the pod template's image
  #         # string (":latest") is unchanged even though the tag's actual content is new.
  #         # rollout restart forces a new pod generation regardless, and imagePullPolicy: Always
  #         # (set in k8s/overlays/azure) makes that generation fetch the fresh image bits.
  #         kubectl rollout restart deployment/backend-deployment -n real-estate
  #         kubectl rollout status deployment/backend-deployment -n real-estate --timeout=120s
