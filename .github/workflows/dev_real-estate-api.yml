# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Auto-generated by Azure's Deployment Center, then hand-edited to fit our promotion flow:
# - Retargeted from `dev` to `main` -- Azure's default deployed straight off dev, which
#   bypassed the whole feature -> dev -> main review flow entirely.
# - Added a test step (the original build job never ran the test suite before deploying).
# - Added `environment: prod` on the deploy job, reusing the same GitHub Environment (with
#   required-reviewer approval) already set up for the old BigRock deploy -- so this now
#   pauses for manual approval before it actually deploys, same as everything else.
#
# NOTE: if you touch this app's Deployment Center settings in the Azure portal again, Azure
# may regenerate/overwrite this file with the unmodified version -- re-apply these edits if so.
#
# SUPERSEDED by docker-deploy.yml (container-based deploy to Docker Hub + Azure Web App for
# Containers). The push-to-main trigger below is disabled so this one no longer fires
# automatically -- kept only as a manual (workflow_dispatch) fallback to the old binary deploy.

name: Build and deploy ASP.Net Core app to Azure Web App - real-estate-api

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: dotnet restore
        run: dotnet restore RealEstate.Api/RealEstate.Api.csproj

      - name: Build with dotnet
        run: dotnet build RealEstate.Api/RealEstate.Api.csproj --configuration Release --no-restore

      - name: dotnet test
        run: dotnet test RealEstate.Tests/RealEstate.Tests.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish RealEstate.Api/RealEstate.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    environment: prod
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D58926F8AED6469391F9E1E7005C7A25 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AD97236815ED401CBE4F52084F3D750D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6976691A9DA948088CC057689596C4B8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'real-estate-api'
          slot-name: 'Production'
          package: .
