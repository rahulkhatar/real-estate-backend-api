# Pipeline for the Dev-RealEstateAPI project — day-to-day fast feedback. Build + test only: no
# deploy stage, no FTP credentials, no access to the prod variable group or approval gate (those
# live in the separate RealEstateAPI project, whose pipeline is sourced directly from this repo's
# `main` branch — see the branch-flow notes at the bottom of azure-pipelines.yml).
#
# Branch flow: feature/* branches PR into `dev` (this pipeline runs as that PR's required build
# validation check, and again on the resulting push to `dev`) -- when ready to release, `dev` PRs
# into `main` (this pipeline validates that PR too; landing on `main` is what triggers the Prod
# pipeline in the RealEstateAPI project).

trigger:
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev
      - main

pool:
  name: 'AgentSelfHosted'

variables:
  - name: buildConfiguration
    value: 'Release'
  - name: apiProject
    value: 'RealEstate.Api/RealEstate.Api.csproj'
  - name: testProject
    value: 'RealEstate.Tests/RealEstate.Tests.csproj'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet restore'
    inputs:
      command: 'restore'
      projects: '$(apiProject)'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      command: 'build'
      projects: '$(apiProject)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet test'
    inputs:
      command: 'test'
      projects: '$(testProject)'
      arguments: '--configuration $(buildConfiguration)'
      # publishTestResults defaults to true, which already appends its own
      # --logger trx --results-directory $(Agent.TempDirectory) -- adding those
      # manually here duplicates the flags and breaks the dotnet CLI's argument
      # parsing (caught by the first real run on the self-hosted agent).

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)'
